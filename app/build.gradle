plugins {
    id 'com.android.application'
}

// API keys live in local.properties (git-ignored), see README.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def secret = { String name -> localProperties.getProperty(name, '') }

android {
    namespace 'com.example.dmitro.weatherapp'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.dmitro.weatherapp"
        minSdk 24
        targetSdk 37
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField 'String', 'BASE_WEATHER_URL', '"https://api.openweathermap.org/data/2.5/"'
        buildConfigField 'String', 'BASE_GEO_URL', '"https://maps.googleapis.com/"'
        buildConfigField 'String', 'ICON_WEATHER_URL', '"https://openweathermap.org/img/w/"'
        buildConfigField 'String', 'WEATHER_API_KEY', "\"${secret('WEATHER_API_KEY')}\""
        buildConfigField 'String', 'PLACES_API_KEY', "\"${secret('PLACES_API_KEY')}\""
        buildConfigField 'String', 'GOOGLE_SERVER_CLIENT_ID', "\"${secret('GOOGLE_SERVER_CLIENT_ID')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.loader:loader:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'com.github.bumptech.glide:glide:5.0.9'

    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.libraries.places:places:6.0.2'

    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
